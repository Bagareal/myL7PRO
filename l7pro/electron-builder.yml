appId: com.bagareal.myl7pro
productName: myL7PRO
directories:
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/node-hid/**
  - node_modules/active-win/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: x64
  artifactName: myL7PRO-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
publish: null
